name = "stylus"
description = "Stylus (Brave): userstyles do Catppuccin com as cores do macOS + estilo de vidro"
order = 81
packages = []
aur_packages = []
detect = "command -v brave || command -v brave-browser || command -v brave-browser-stable"
# Gera templates/ a partir de vendor/catppuccin-userstyles (submodule) e da paleta.
generate = "generate.py"
# Não há como instalar userstyles fora da UI do Stylus: o alvo só entrega o arquivo.
message = """
Importe no Stylus: ícone do Stylus -> Gerenciar -> Importar ->
  ~/.local/share/${theme_id}/stylus/import.json
ANTES de importar, apague estilos de outros temas (ex.: "… Catppuccin"): senão os dois
ficam ativos em cada site e brigam. Ao reimportar uma versão nova, apague os "… ${theme_name}" antes.
O "Vidro ${theme_name}" é um estilo à parte: dá para desligar sozinho se algum site quebrar."""

[[files]]
src = "templates/import.json"
dest = "~/.local/share/${theme_id}/stylus/import.json"
mode = "copy"
